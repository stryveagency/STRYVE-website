<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRYVE — Links</title>
<style>
  @font-face {
    font-family: 'Open Sauce';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/open-sauce-one@latest/latin-800-normal.woff2') format('woff2');
    font-weight: 800;
  }
  @font-face {
    font-family: 'Open Sauce';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/open-sauce-one@latest/latin-500-normal.woff2') format('woff2');
    font-weight: 500;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Open Sauce', sans-serif;
    background:
      linear-gradient(rgba(5,6,7,0.94), rgba(13,43,44,0.96)),
      repeating-linear-gradient(0deg, #1a1f1f 0px, #1a1f1f 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, #1a1f1f 0px, #1a1f1f 1px, transparent 1px, transparent 26px),
      #050607;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  .mono-img {
    width: 72px; height: auto;
    margin: 0 auto 18px; display: block;
  }
  .wordmark {
    font-weight: 800; font-size: 26px; letter-spacing: 3px; color: #fff;
    margin-bottom: 6px;
  }
  .tagline {
    font-weight: 500; font-size: 14px; color: #9fb3b3; margin-bottom: 36px;
    letter-spacing: 0.3px;
  }
  a.linkbtn {
    display: block;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0,255,209,0.25);
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 14px;
    transition: all 0.2s ease;
  }
  a.linkbtn:hover, a.linkbtn:active {
    background: rgba(0,255,209,0.1);
    border-color: #00FFD1;
    transform: translateY(-1px);
  }
  a.linkbtn .label { display: flex; align-items: center; justify-content: center; gap: 10px; }
  a.primary {
    background: linear-gradient(135deg, #00819D, #00FFD1);
    color: #050607;
    font-weight: 800;
    border: none;
  }
  a.primary:hover { opacity: 0.92; transform: translateY(-1px); }
  footer { margin-top: 30px; font-size: 12px; color: #5c6b6b; }

  .star-img {
    position: fixed;
    width: 220px;
    top: -30px;
    right: -50px;
    opacity: 0.55;
    transform: rotate(15deg);
    filter: drop-shadow(0 0 22px rgba(0,255,209,0.6));
    z-index: 0;
    pointer-events: none;
  }
  .wrap { position: relative; z-index: 1; }
  .logo-area { position: relative; }
</style>
